[workspace]
members = ["crates/drift-core", "crates/drift-app", "crates/drift-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/WariKoda/drift"

[workspace.dependencies]
drift-core = { path = "crates/drift-core" }
drift-app = { path = "crates/drift-app" }
gpui-kit = "=0.7.0"
unicode-segmentation = "=1.13.3"
serde = { version = "1", features = ["derive"] }
semver = "=1.0.28"
toml = "1"
cap-std = "4"
fs2 = "0.4"
thiserror = "2"
getrandom = "0.4"
nix = "0.31"
tempfile = "3"
libc = "0.2"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "io-util"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
async-trait = "0.1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
similar = { version = "=3.2.0", features = ["bytes"] }
suppaftp = { version = "=12.1.0", default-features = false, features = ["tokio-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
x509-parser = "=0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# GPUI's dependency graph is large. Keep CI and local debug links bounded.
[profile.dev]
debug = 0

[profile.test]
debug = 0
